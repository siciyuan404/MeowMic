<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowMic 控制台</title>
    <style>
        :root {
            /* 配色 */
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --card-border: #0f3460;
            --accent: #667eea;
            --accent-2: #764ba2;
            --text: #eee;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;

            /* 圆角 */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            /* 间距 */
            --gap-xs: 4px;
            --gap-sm: 8px;
            --gap-md: 16px;
            --gap-lg: 24px;

            /* 字体 */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            padding: var(--gap-md);
            min-height: 100vh;
        }
        .container { max-width: 440px; margin: 0 auto; }
        h1 {
            font-size: 20px;
            margin-bottom: var(--gap-md);
            text-align: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            margin-bottom: var(--gap-md);
            border: 1px solid var(--card-border);
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--gap-sm);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            font-size: 14px;
            font-weight: 500;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .status-dot.running {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-dot.stopped { background: var(--danger); }
        .btn {
            padding: var(--gap-sm) var(--gap-lg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: var(--success);
            color: white;
        }
        .btn-start:hover:not(:disabled) { background: #059669; }
        .btn-stop {
            background: var(--danger);
            color: white;
        }
        .btn-stop:hover:not(:disabled) { background: #dc2626; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--gap-sm);
        }
        .stat-item {
            background: var(--card-border);
            border-radius: var(--radius-sm);
            padding: var(--gap-sm);
            text-align: center;
            transition: box-shadow 0.3s ease;
        }
        .stat-item.glow {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
        }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: var(--gap-xs); }
        .stat-value { font-size: 18px; font-weight: 700; color: var(--accent); }
        .stat-value.flash { animation: valueFlash 0.5s ease-out; }
        @keyframes valueFlash {
            0% { color: var(--success); }
            100% { color: var(--accent); }
        }
        .settings-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: var(--gap-md);
            margin-bottom: var(--gap-md);
            border: 1px solid var(--card-border);
        }
        .settings-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: var(--gap-sm);
            color: var(--accent);
        }
        .form-row {
            margin-bottom: var(--gap-sm);
        }
        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: var(--gap-xs);
        }
        .form-input, .form-select {
            width: 100%;
            padding: var(--gap-sm) 12px;
            background: var(--card-border);
            border: 1px solid #1e40af;
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 13px;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .port-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: var(--gap-sm);
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            margin-bottom: var(--gap-sm);
        }
        .checkbox-row input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }
        .checkbox-row label {
            font-size: 13px;
            cursor: pointer;
        }
        .error-msg {
            background: #7f1d1d;
            color: #fecaca;
            padding: var(--gap-sm) 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            margin-top: var(--gap-sm);
            display: none;
        }
        .error-msg.show { display: block; }
        .muted-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: var(--gap-sm);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 MeowMic 控制台</h1>

        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator">
                    <div id="statusDot" class="status-dot stopped"></div>
                    <span id="statusText">已停止</span>
                </div>
                <div>
                    <button id="startBtn" class="btn btn-start" onclick="startService()">启动</button>
                    <button id="stopBtn" class="btn btn-stop" onclick="stopService()" disabled>停止</button>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-item" id="statUptimeCard">
                    <div class="stat-label">⏱️ 运行时长</div>
                    <div class="stat-value" id="statUptime">0s</div>
                </div>
                <div class="stat-item" id="statConnsCard">
                    <div class="stat-label">🔗 连接数</div>
                    <div class="stat-value" id="statConns">0</div>
                </div>
                <div class="stat-item" id="statTouchesCard">
                    <div class="stat-label">👆 触控/秒</div>
                    <div class="stat-value" id="statTouches">0</div>
                </div>
                <div class="stat-item" id="statAudioCard">
                    <div class="stat-label">🎵 音频/秒</div>
                    <div class="stat-value" id="statAudio">0</div>
                </div>
            </div>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <div class="settings-card">
            <div class="settings-title">⚙️ 基础设置</div>
            <div class="form-row">
                <label class="form-label">基础端口</label>
                <input type="number" id="tcpPort" class="form-input" placeholder="28900">
            </div>
            <div class="muted-text">
                默认: 28900（TCP=28900 / 触控=28901 / 音频=28902 / 状态=28903）
            </div>
            <div class="muted-text">使用系统默认音频输出设备</div>
            <div class="checkbox-row">
                <input type="checkbox" id="muteSpeaker">
                <label for="muteSpeaker">静音外放 (仅接收麦克风输入)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="autoStart">
                <label for="autoStart">启动控制台时自动启动服务</label>
            </div>
        </div>
    </div>

    <script>
        let config = {
            base_port: 28900,
            mute_speaker: false,
            auto_start: false,
            sensitivity: 1.2,
        };
        let statusInterval = null;

        async function init() {
            try {
                const Tauri = window.__TAURI__;
                if (!Tauri) {
                    document.getElementById('errorMsg').textContent = 'Tauri 未加载,请通过桌面应用运行';
                    document.getElementById('errorMsg').classList.add('show');
                    return;
                }

                config = await Tauri.invoke('get_config');
                applyConfigToUI(config);

                updateStatus();
                statusInterval = setInterval(updateStatus, 1000);
            } catch(e) {
                console.error(e);
            }
        }

        function applyConfigToUI(cfg) {
            document.getElementById('tcpPort').value = cfg.base_port;
            document.getElementById('muteSpeaker').checked = cfg.mute_speaker;
            document.getElementById('autoStart').checked = cfg.auto_start;
        }

        function getConfigFromUI() {
            return {
                base_port: parseInt(document.getElementById('tcpPort').value) || 28900,
                mute_speaker: document.getElementById('muteSpeaker').checked,
                auto_start: document.getElementById('autoStart').checked,
                sensitivity: 1.2,
            };
        }

        async function startService() {
            const cfg = getConfigFromUI();
            const Tauri = window.__TAURI__;
            try {
                await Tauri.invoke('start_service', { config: cfg });
                showError('');
            } catch(e) {
                showError(e);
            }
        }

        async function stopService() {
            const Tauri = window.__TAURI__;
            try {
                await Tauri.invoke('stop_service');
                showError('');
            } catch(e) {
                showError(e);
            }
        }

        async function updateStatus() {
            const Tauri = window.__TAURI__;
            try {
                const status = await Tauri.invoke('get_status');
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');

                if (status.running) {
                    dot.className = 'status-dot running';
                    text.textContent = '运行中';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    dot.className = 'status-dot stopped';
                    text.textContent = '已停止';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }

                setStatValue('statUptime', formatUptime(status.uptime_secs));
                setStatValue('statConns', status.connections);
                setStatValue('statTouches', status.touches_per_sec);
                setStatValue('statAudio', status.audio_frames_per_sec);

                const touchesCard = document.getElementById('statTouchesCard');
                if (status.touches_per_sec > 0) {
                    touchesCard.classList.add('glow');
                } else {
                    touchesCard.classList.remove('glow');
                }
            } catch(e) {
                console.error(e);
            }
        }

        function setStatValue(id, value) {
            const el = document.getElementById(id);
            const str = String(value);
            if (el.textContent !== str) {
                el.textContent = str;
                el.classList.remove('flash');
                void el.offsetWidth;
                el.classList.add('flash');
            }
        }

        function formatUptime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            if (msg) {
                el.textContent = msg;
                el.classList.add('show');
            } else {
                el.classList.remove('show');
            }
        }

        init();
    </script>
</body>
</html>
