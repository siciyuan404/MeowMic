<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowMic 控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 440px; margin: 0 auto; }
        h1 {
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-card {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #0f3460;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .status-dot.running {
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-dot.stopped { background: #ef4444; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: #10b981;
            color: white;
        }
        .btn-start:hover:not(:disabled) { background: #059669; }
        .btn-stop {
            background: #ef4444;
            color: white;
        }
        .btn-stop:hover:not(:disabled) { background: #dc2626; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .stat-item {
            background: #0f3460;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: 700; color: #667eea; }
        .settings-card {
            background: #16213e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #0f3460;
        }
        .settings-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #a5b4fc;
        }
        .form-row {
            margin-bottom: 12px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 8px 12px;
            background: #0f3460;
            border: 1px solid #1e40af;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
        }
        .port-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .checkbox-row input {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }
        .checkbox-row label {
            font-size: 13px;
            cursor: pointer;
        }
        .error-msg {
            background: #7f1d1d;
            color: #fecaca;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 MeowMic 控制台</h1>

        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator">
                    <div id="statusDot" class="status-dot stopped"></div>
                    <span id="statusText">已停止</span>
                </div>
                <div>
                    <button id="startBtn" class="btn btn-start" onclick="startService()">启动</button>
                    <button id="stopBtn" class="btn btn-stop" onclick="stopService()" disabled>停止</button>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">运行时长</div>
                    <div class="stat-value" id="statUptime">0s</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">连接数</div>
                    <div class="stat-value" id="statConns">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">触控/秒</div>
                    <div class="stat-value" id="statTouches">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">音频/秒</div>
                    <div class="stat-value" id="statAudio">0</div>
                </div>
            </div>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <div class="settings-card">
            <div class="settings-title">⚙️ 基础设置</div>
            <div class="form-row">
                <label class="form-label">端口配置</label>
                <div class="port-group">
                    <div>
                        <input type="number" id="tcpPort" class="form-input" placeholder="TCP">
                        <div style="font-size:10px;color:#94a3b8;margin-top:2px">TCP 控制</div>
                    </div>
                    <div>
                        <input type="number" id="touchPort" class="form-input" placeholder="Touch">
                        <div style="font-size:10px;color:#94a3b8;margin-top:2px">触控 UDP</div>
                    </div>
                    <div>
                        <input type="number" id="audioPort" class="form-input" placeholder="Audio">
                        <div style="font-size:10px;color:#94a3b8;margin-top:2px">音频 UDP</div>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <label class="form-label">音频输出设备</label>
                <select id="outputDevice" class="form-select">
                    <option value="">加载中...</option>
                </select>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="muteSpeaker">
                <label for="muteSpeaker">静音外放 (仅接收麦克风输入)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="autoStart">
                <label for="autoStart">启动控制台时自动启动服务</label>
            </div>
        </div>
    </div>

    <script>
        let config = {
            tcp_port: 28900,
            touch_port: 28901,
            audio_port: 28902,
            output_device: "",
            mute_speaker: false,
            auto_start: false,
        };
        let statusInterval = null;

        async function init() {
            try {
                const Tauri = window.__TAURI__;
                if (!Tauri) {
                    document.getElementById('errorMsg').textContent = 'Tauri 未加载,请通过桌面应用运行';
                    document.getElementById('errorMsg').classList.add('show');
                    return;
                }

                config = await Tauri.invoke('get_config');
                applyConfigToUI(config);

                const devices = await Tauri.invoke('get_output_devices');
                const select = document.getElementById('outputDevice');
                select.innerHTML = '';
                devices.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d === '默认设备' ? '' : d;
                    opt.textContent = d;
                    if (d === config.output_device || (d === '默认设备' && !config.output_device)) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });

                updateStatus();
                statusInterval = setInterval(updateStatus, 1000);
            } catch(e) {
                console.error(e);
            }
        }

        function applyConfigToUI(cfg) {
            document.getElementById('tcpPort').value = cfg.tcp_port;
            document.getElementById('touchPort').value = cfg.touch_port;
            document.getElementById('audioPort').value = cfg.audio_port;
            document.getElementById('muteSpeaker').checked = cfg.mute_speaker;
            document.getElementById('autoStart').checked = cfg.auto_start;
        }

        function getConfigFromUI() {
            return {
                tcp_port: parseInt(document.getElementById('tcpPort').value) || 28900,
                touch_port: parseInt(document.getElementById('touchPort').value) || 28901,
                audio_port: parseInt(document.getElementById('audioPort').value) || 28902,
                output_device: document.getElementById('outputDevice').value,
                mute_speaker: document.getElementById('muteSpeaker').checked,
                auto_start: document.getElementById('autoStart').checked,
            };
        }

        async function startService() {
            const cfg = getConfigFromUI();
            const Tauri = window.__TAURI__;
            try {
                await Tauri.invoke('start_service', { config: cfg });
                showError('');
            } catch(e) {
                showError(e);
            }
        }

        async function stopService() {
            const Tauri = window.__TAURI__;
            try {
                await Tauri.invoke('stop_service');
                showError('');
            } catch(e) {
                showError(e);
            }
        }

        async function updateStatus() {
            const Tauri = window.__TAURI__;
            try {
                const status = await Tauri.invoke('get_status');
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');

                if (status.running) {
                    dot.className = 'status-dot running';
                    text.textContent = '运行中';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    dot.className = 'status-dot stopped';
                    text.textContent = '已停止';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }

                document.getElementById('statUptime').textContent = formatUptime(status.uptime_secs);
                document.getElementById('statConns').textContent = status.connections;
                document.getElementById('statTouches').textContent = status.touches_per_sec;
                document.getElementById('statAudio').textContent = status.audio_frames_per_sec;
            } catch(e) {
                console.error(e);
            }
        }

        function formatUptime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            if (msg) {
                el.textContent = msg;
                el.classList.add('show');
            } else {
                el.classList.remove('show');
            }
        }

        init();
    </script>
</body>
</html>
