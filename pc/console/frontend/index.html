<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>MeowMic 控制台</title>
    <style>
        :root {
            /* ===== TraeWork 设计令牌（浅色主题） ===== */
            /* radius */
            --radius-4: 4px;
            --radius-8: 8px;
            --radius-12: 12px;
            --radius-full: 999px;

            /* spacers */
            --spacer-4: 4px;
            --spacer-6: 6px;
            --spacer-8: 8px;
            --spacer-10: 10px;
            --spacer-12: 12px;
            --spacer-16: 16px;
            --spacer-20: 20px;
            --spacer-24: 24px;
            --spacer-32: 32px;

            /* icon sizes */
            --icon-size-12: 12px;
            --icon-size-14: 14px;
            --icon-size-16: 16px;
            --icon-size-20: 20px;

            /* font */
            --font-family-default: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --font-family-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, sans-serif;

            /* bg */
            --bg-base-default: #FFFFFF;
            --bg-base-secondary: #F5F5F5;
            --bg-overlay-l1: rgba(115, 115, 115, 0.08);
            --bg-overlay-l2: rgba(115, 115, 115, 0.12);
            --bg-overlay-l3: rgba(115, 115, 115, 0.16);
            --bg-overlay-l4: rgba(115, 115, 115, 0.20);

            /* bg-brand */
            --bg-brand: #4B3FE3;
            --bg-brand-hover: #6A6FFF;
            --bg-brand-active: #3F31C6;
            --bg-brand-disabled: rgba(75, 63, 227, 0.22);
            --bg-brand-popup: rgba(170, 183, 255, 0.36);

            /* text */
            --text-default: #171717;
            --text-secondary: #404040;
            --text-tertiary: #737373;
            --text-disabled: #A1A1A1;
            --text-onbrand: #FFFFFF;
            --text-white: #FFFFFF;
            --text-brand: #4B3FE3;

            /* icon */
            --icon-default: #262626;
            --icon-secondary: #404040;
            --icon-tertiary: #737373;
            --icon-onbrand: #FFFFFF;
            --icon-brand: #4B3FE3;

            /* border */
            --border-neutral-l1: rgba(115, 115, 115, 0.12);
            --border-neutral-l2: rgba(115, 115, 115, 0.18);
            --border-neutral-l3: rgba(115, 115, 115, 0.36);
            --border-contrast: #000000;

            /* status */
            --status-error-default: #E8463A;
            --status-error-hover: #EA574C;
            --status-success-default: #15A877;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        body {
            font-family: var(--font-family-default);
            background: transparent;
            color: var(--text-default);
            font-size: 14px;
            line-height: 20px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ 窗口圆角框架 ============ */
        .window-frame {
            height: 100vh;
            background: var(--bg-base-default);
            border: 1px solid var(--border-neutral-l2);
            border-radius: var(--radius-12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        /* 最大化:去掉圆角/边框/阴影,贴满屏幕 */
        body.maximized .window-frame {
            border-radius: 0;
            border: none;
            box-shadow: none;
        }
        /* 失焦:边框和阴影变淡 */
        body.unfocused .window-frame {
            border-color: var(--border-neutral-l1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .mono, .metric-value {
            font-family: var(--font-family-metric);
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1, "lnum" 1;
        }

        /* ============ 自定义标题栏 ============ */
        .titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 36px;
            padding: 0 8px 0 14px;
            background: var(--bg-base-secondary);
            border-bottom: 1px solid var(--border-neutral-l1);
            flex-shrink: 0;
        }
        .titlebar-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: default;
        }
        .titlebar-title svg { width: 16px; height: 16px; color: var(--icon-brand); }
        .titlebar-buttons {
            display: flex;
            gap: 2px;
        }
        .win-ctrl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: transparent;
            color: var(--text-tertiary);
            border: none;
            border-radius: var(--radius-4);
            cursor: pointer;
            transition: background .12s ease, color .12s ease;
        }
        .win-ctrl-btn:hover { background: var(--bg-overlay-l2); color: var(--text-default); }
        .win-ctrl-btn--close:hover {
            background: var(--status-error-default);
            color: var(--text-white);
        }
        .win-ctrl-btn svg { width: 14px; height: 14px; }

        /* ============ 主内容区 ============ */
        .container {
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            padding: var(--spacer-16);
            display: flex;
            flex-direction: column;
            gap: var(--spacer-16);
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .container::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ============ Card ============ */
        .ds-card {
            background: var(--bg-base-secondary);
            border: 1px solid var(--border-neutral-l1);
            border-radius: var(--radius-12);
            padding: var(--spacer-16);
            color: var(--text-default);
        }

        /* ============ Status Card ============ */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacer-12);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacer-8);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-default);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: var(--radius-full);
            background: var(--status-error-default);
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .status-dot.running {
            background: var(--status-success-default);
            box-shadow: 0 0 8px var(--status-success-default);
            animation: pulse 1.5s infinite;
        }
        .status-dot.stopped { background: var(--status-error-default); }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ============ Buttons ============ */
        .ds-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacer-6);
            height: 28px;
            padding: 0 var(--spacer-12);
            border-radius: var(--radius-8);
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            font-family: var(--font-family-default);
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            transition: background .12s ease, color .12s ease, border-color .12s ease, opacity .12s ease;
        }
        .ds-btn svg {
            width: var(--icon-size-16);
            height: var(--icon-size-16);
            flex: 0 0 auto;
        }
        .ds-btn--brand {
            background: var(--bg-brand);
            color: var(--text-onbrand);
            border-color: var(--bg-brand);
        }
        .ds-btn--brand:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); }
        .ds-btn--brand:active { background: var(--bg-brand-active); border-color: var(--bg-brand-active); }
        .ds-btn--brand[disabled] {
            background: var(--bg-brand-disabled);
            border-color: transparent;
            color: var(--text-onbrand);
            cursor: not-allowed;
        }
        .ds-btn--secondary {
            background: var(--bg-overlay-l1);
            color: var(--text-default);
            border-color: var(--border-neutral-l1);
        }
        .ds-btn--secondary:hover { background: var(--bg-overlay-l2); border-color: var(--border-neutral-l2); }
        .ds-btn--secondary[disabled] {
            color: var(--text-disabled);
            cursor: not-allowed;
            opacity: .7;
        }

        /* ============ Stats Grid ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacer-8);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-overlay-l1);
            border-radius: var(--radius-8);
            padding: var(--spacer-8);
            transition: box-shadow 0.3s ease;
        }
        .stat-item.glow {
            box-shadow: 0 0 12px rgba(75, 63, 227, 0.35);
        }
        .stat-label {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2px;
        }
        .stat-label svg {
            width: var(--icon-size-12);
            height: var(--icon-size-12);
            color: var(--icon-tertiary);
        }
        .stat-label span {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-brand);
            line-height: 24px;
        }
        .stat-value.flash { animation: valueFlash 0.5s ease-out; }
        @keyframes valueFlash {
            0% { color: var(--bg-brand-hover); transform: scale(1.05); }
            100% { color: var(--text-brand); transform: scale(1); }
        }

        /* ============ Settings Card ============ */
        .settings-title {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: var(--spacer-12);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-brand);
        }
        .settings-title svg {
            width: var(--icon-size-16);
            height: var(--icon-size-16);
            color: var(--icon-brand);
        }
        .form-row { display: flex; flex-direction: column; }
        .form-row + .form-row { margin-top: var(--spacer-12); }
        .form-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }
        .form-hint {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
            line-height: 16px;
        }

        /* ============ Input / Select ============ */
        .ds-input {
            display: flex;
            align-items: center;
            gap: var(--spacer-8);
            min-height: 32px;
            padding: 0 var(--spacer-12);
            background: var(--bg-base-default);
            border: 1px solid var(--border-neutral-l1);
            border-radius: var(--radius-8);
            color: var(--text-default);
            width: 100%;
            font-family: var(--font-family-default);
            font-size: 14px;
            line-height: 20px;
        }
        .ds-input:focus-within {
            border-color: var(--border-contrast);
            background: var(--bg-base-default);
        }
        .ds-input input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-default);
            font: inherit;
            min-width: 0;
        }
        .ds-input input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
        }
        .ds-input input[type="number"]::-webkit-outer-spin-button,
        .ds-input input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .ds-input input::placeholder { color: var(--text-tertiary); }

        .ds-select-wrap {
            position: relative;
            width: 100%;
        }
        .ds-select {
            width: 100%;
            height: 32px;
            padding: 0 var(--spacer-32) 0 var(--spacer-12);
            background-color: var(--bg-base-default);
            color: var(--text-default);
            border: 1px solid var(--border-neutral-l1);
            border-radius: var(--radius-8);
            appearance: none;
            -webkit-appearance: none;
            font: inherit;
            font-size: 14px;
        }
        .ds-select:focus {
            border-color: var(--border-contrast);
            background-color: var(--bg-base-default);
            outline: none;
        }
        .ds-select__icon {
            position: absolute;
            right: var(--spacer-12);
            top: 50%;
            width: 16px;
            height: 16px;
            color: var(--icon-secondary);
            pointer-events: none;
            transform: translateY(-50%);
        }

        /* ============ Checkbox ============ */
        .ds-check {
            display: inline-flex;
            align-items: center;
            gap: var(--spacer-8);
            min-height: 24px;
            font-size: 14px;
            color: var(--text-default);
            cursor: pointer;
            user-select: none;
        }
        .ds-check input { display: none; }
        .ds-check__box {
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-neutral-l2);
            background: var(--bg-base-default);
            border-radius: var(--radius-4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-onbrand);
            transition: background .12s, border-color .12s;
            flex-shrink: 0;
        }
        .ds-check input:checked + .ds-check__box {
            background: var(--bg-brand);
            border-color: var(--bg-brand);
        }
        .ds-check input:checked + .ds-check__box::after {
            content: '';
            width: 8px;
            height: 4px;
            border-left: 2px solid var(--text-onbrand);
            border-bottom: 2px solid var(--text-onbrand);
            transform: rotate(-45deg) translate(1px, -1px);
        }

        /* ============ Error Message ============ */
        .error-msg {
            background: rgba(232, 70, 58, 0.12);
            color: var(--status-error-default);
            padding: var(--spacer-8) var(--spacer-12);
            border-radius: var(--radius-8);
            font-size: 12px;
            margin-top: var(--spacer-8);
            display: none;
            border: 1px solid rgba(232, 70, 58, 0.16);
        }
        .error-msg.show { display: block; }
        .error-msg.info {
            background: var(--bg-overlay-l1);
            color: var(--text-secondary);
            border-color: var(--border-neutral-l1);
        }

        /* ============ 配对面板 ============ */
        .pairing-pin-block {
            background: var(--bg-overlay-l1);
            border-radius: var(--radius-8);
            padding: 12px;
            margin-bottom: 12px;
        }
        .pairing-pin-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 6px;
        }
        .pairing-pin-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
        }
        .pairing-pin-value {
            font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 6px;
            color: var(--bg-brand);
            line-height: 1.1;
            transition: opacity .2s ease;
        }
        .pairing-pin-value.empty {
            color: var(--text-tertiary);
            font-size: 18px;
            letter-spacing: 0;
        }
        .pairing-clients-block {
            margin-top: 8px;
        }
        .pairing-clients-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .pairing-clients-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .pairing-reset-btn {
            height: 24px;
            font-size: 12px;
            padding: 0 10px;
        }
        .pairing-clients-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pairing-client-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-overlay-l1);
            border-radius: var(--radius-8);
            transition: background .12s ease;
        }
        .pairing-client-item:hover {
            background: var(--bg-overlay-l2);
        }
        .pairing-client-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .pairing-client-name {
            font-size: 13px;
            color: var(--text-default);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pairing-client-meta {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        .pairing-client-unpair {
            height: 22px;
            font-size: 11px;
            padding: 0 8px;
            color: var(--status-error-default);
            background: transparent;
            border: 1px solid rgba(232, 70, 58, 0.24);
        }
        .pairing-client-unpair:hover {
            background: rgba(232, 70, 58, 0.08);
            border-color: rgba(232, 70, 58, 0.4);
        }
        .pairing-empty {
            font-size: 12px;
            color: var(--text-tertiary);
            text-align: center;
            padding: 16px 8px;
            background: var(--bg-overlay-l1);
            border-radius: var(--radius-8);
        }
        .pairing-pin-value.flash {
            animation: pinFlash .4s ease;
        }
        @keyframes pinFlash {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
  <!-- 窗口圆角框架 -->
  <div class="window-frame">
    <!-- 自定义标题栏（可拖拽 + 窗口控制） -->
    <div class="titlebar" id="titlebar">
        <div class="titlebar-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5c.94 0 1.81.53 2.26 1.38l.66 1.27c.27.51.36 1.1.66 1.6"/>
                <path d="M8 15c-1.5 0-3 .5-3 2.5S6 20 8 20c1.5 0 2.84-.5 4-1"/>
                <path d="M8 17.5c-1.5 0-2 .5-2 1.5s.5 1.5 2 1.5"/>
                <path d="M8 4.5c0 1.5.5 2.5 1.5 3.5"/>
                <path d="M11 17c0-1.5.5-3 2-3.5"/>
                <path d="M16 19c0-1.5.5-3 2-3.5"/>
                <path d="M19 19c0-1 .5-2 1.5-2.5"/>
                <path d="M5 11c0-1.5.5-3 2-4"/>
                <path d="M2 12c0-1.5.5-3 2-4"/>
            </svg>
            <span>MeowMic 控制台</span>
        </div>
        <div class="titlebar-buttons">
            <button class="win-ctrl-btn" type="button" onclick="windowMinimize()" title="最小化">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
            </button>
            <button class="win-ctrl-btn" type="button" onclick="windowToggleMax()" title="最大化/还原">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
            </button>
            <button class="win-ctrl-btn win-ctrl-btn--close" type="button" onclick="windowClose()" title="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="container">
        <!-- 状态卡片 -->
        <div class="ds-card">
            <div class="status-header">
                <div class="status-indicator">
                    <span id="statusDot" class="status-dot stopped"></span>
                    <span id="statusText">已停止</span>
                </div>
                <div style="display:flex;gap:8px;">
                    <button id="startBtn" class="ds-btn ds-btn--brand" onclick="startService()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                        启动
                    </button>
                    <button id="stopBtn" class="ds-btn ds-btn--secondary" onclick="stopService()" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                        停止
                    </button>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-item" id="statUptimeCard">
                    <div class="stat-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>运行时长</span>
                    </div>
                    <div class="stat-value metric-value" id="statUptime">0s</div>
                </div>
                <div class="stat-item" id="statConnsCard">
                    <div class="stat-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>连接数</span>
                    </div>
                    <div class="stat-value metric-value" id="statConns">0</div>
                </div>
                <div class="stat-item" id="statTouchesCard">
                    <div class="stat-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
                        <span>触控/秒</span>
                    </div>
                    <div class="stat-value metric-value" id="statTouches">0</div>
                </div>
                <div class="stat-item" id="statAudioCard">
                    <div class="stat-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                        <span>音频/秒</span>
                    </div>
                    <div class="stat-value metric-value" id="statAudio">0</div>
                </div>
            </div>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <!-- 设置卡片 -->
        <div class="ds-card">
            <div class="settings-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>基础设置</span>
            </div>

            <div class="form-row">
                <label class="form-label">基础端口</label>
                <div class="ds-input">
                    <input type="number" id="tcpPort" placeholder="28900">
                </div>
                <p class="form-hint">默认: 28900（TCP=28900 / 触控=28901 / 音频=28902 / 状态=28903）</p>
            </div>

            <div class="form-row">
                <label class="form-label">音频输出设备</label>
                <div class="ds-select-wrap">
                    <select id="outputDevice" class="ds-select">
                        <option value="">加载中...</option>
                    </select>
                    <svg class="ds-select__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <p class="form-hint">选择 "CABLE Input" 等虚拟音频设备可将声音路由到其他应用</p>
            </div>

            <label class="ds-check" style="margin-top: 12px;">
                <input type="checkbox" id="muteSpeaker" onchange="onMuteSpeakerChange()">
                <span class="ds-check__box"></span>
                <span>静音外放（仅接收麦克风输入）</span>
            </label>

            <label class="ds-check" style="margin-top: 8px;">
                <input type="checkbox" id="autoStart">
                <span class="ds-check__box"></span>
                <span>启动控制台时自动启动服务</span>
            </label>
        </div>

        <!-- 配对面板 -->
        <div class="ds-card">
            <div class="settings-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>设备配对</span>
            </div>
            <div id="pairingContent">
                <!-- PIN 显示区 -->
                <div class="pairing-pin-block">
                    <div class="pairing-pin-label">当前 PIN(新设备配对码)</div>
                    <div class="pairing-pin-row">
                        <div id="pairingPin" class="pairing-pin-value">------</div>
                        <button class="ds-btn ds-btn--secondary" type="button" onclick="refreshPairing()" id="refreshPairingBtn">刷新</button>
                    </div>
                    <p class="form-hint">手机端首次连接时输入此 PIN 完成配对,配对成功后 PIN 自动失效</p>
                </div>
                <!-- 已配对设备列表 -->
                <div class="pairing-clients-block">
                    <div class="pairing-clients-header">
                        <span class="pairing-clients-title">已配对设备</span>
                        <button class="ds-btn ds-btn--secondary pairing-reset-btn" type="button" onclick="resetPairing()" id="resetPairingBtn">重置配对</button>
                    </div>
                    <div id="pairingClients" class="pairing-clients-list">
                        <div class="pairing-empty">服务未启动</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 关于与更新 -->
        <div class="ds-card">
            <div class="ds-card__title">关于</div>
            <div id="updatePanel" style="margin-top: 8px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                    <span id="versionText" style="font-size:12px; color:var(--text-tertiary);">版本 ...</span>
                    <button class="ds-btn ds-btn--secondary" type="button" onclick="checkForUpdate()" id="checkUpdateBtn">检查更新</button>
                </div>
                <div id="updateStatus" style="margin-top:8px; font-size:12px; color:var(--text-tertiary); min-height:16px; white-space:pre-wrap; word-break:break-word;"></div>
                <div id="updateProgress" style="display:none; margin-top:8px; height:4px; background:var(--bg-overlay-l2); border-radius:var(--radius-full); overflow:hidden;">
                    <div id="updateProgressBar" style="height:100%; width:0%; background:var(--bg-brand); transition:width .2s;"></div>
                </div>
                <button id="installUpdateBtn" class="ds-btn ds-btn--brand" type="button" style="display:none; margin-top:8px; width:100%;" onclick="installUpdate()">重启并安装</button>
            </div>
        </div>
    </div>
  </div>

    <script>
        let config = {
            base_port: 28900,
            output_device: "",
            mute_speaker: false,
            auto_start: false,
            sensitivity: 1.2,
        };
        let statusInterval = null;

        async function init() {
            try {
                const Tauri = window.__TAURI__;
                if (!Tauri) {
                    showError('Tauri 未加载,请通过桌面应用运行', true);
                    return;
                }

                // 标题栏拖拽（点击按钮除外）
                setupTitlebarDrag(Tauri);
                // 窗口边框状态(最大化/失焦)
                setupWindowState(Tauri);

                // 显示当前版本
                try {
                    const ver = await Tauri.app.getVersion();
                    document.getElementById('versionText').textContent = '版本 ' + ver;
                } catch(err) { console.warn('获取版本失败:', err); }

                config = await Tauri.invoke('get_config');
                applyConfigToUI(config);

                try {
                    const devices = await Tauri.invoke('get_output_devices');
                    const select = document.getElementById('outputDevice');
                    select.innerHTML = '';
                    const pendingValue = select.getAttribute('data-pending') || config.output_device || '';
                    devices.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d === '系统默认输出设备' ? '' : d;
                        opt.textContent = d;
                        if (d === pendingValue || (d === '系统默认输出设备' && !pendingValue)) {
                            opt.selected = true;
                        }
                        select.appendChild(opt);
                    });
                    select.removeAttribute('data-pending');
                } catch(e) {
                    console.error('加载输出设备列表失败:', e);
                }

                updateStatus();
                statusInterval = setInterval(updateStatus, 1000);
            } catch(e) {
                console.error(e);
            }
        }

        // ============ 自定义窗口控制 ============
        function setupTitlebarDrag(Tauri) {
            const titlebar = document.getElementById('titlebar');
            if (!titlebar) return;
            titlebar.addEventListener('mousedown', async (e) => {
                if (e.button !== 0) return;
                // 点击按钮时不触发拖拽
                if (e.target.closest('button')) return;
                try { await Tauri.window.getCurrent().startDragging(); } catch(err) {}
            });
            // 双击标题栏切换最大化
            titlebar.addEventListener('dblclick', (e) => {
                if (e.target.closest('button')) return;
                windowToggleMax();
            });
        }

        // ============ 窗口边框状态同步(最大化/失焦) ============
        async function setupWindowState(Tauri) {
            try {
                const win = Tauri.window.getCurrent();
                // 初始同步当前状态
                const isMax = await win.isMaximized();
                document.body.classList.toggle('maximized', !!isMax);
                // 监听最大化/还原
                await win.onResized(() => {
                    win.isMaximized().then(m => {
                        document.body.classList.toggle('maximized', !!m);
                    });
                });
                // 监听焦点/失焦
                await win.onFocusChanged(({ payload: focused }) => {
                    document.body.classList.toggle('unfocused', !focused);
                });
            } catch(err) {
                console.warn('窗口状态监听失败:', err);
            }
        }

        async function windowMinimize() {
            const Tauri = window.__TAURI__;
            try { await Tauri.window.getCurrent().minimize(); } catch(err) { console.error(err); }
        }

        async function windowToggleMax() {
            const Tauri = window.__TAURI__;
            try { await Tauri.window.getCurrent().toggleMaximize(); } catch(err) { console.error(err); }
        }

        async function windowClose() {
            const Tauri = window.__TAURI__;
            try { await Tauri.window.getCurrent().close(); } catch(err) { console.error(err); }
        }

        // ============ 自动更新 ============
        let pendingUpdate = null;  // 待安装的更新对象

        function showUpdateStatus(text, color) {
            const el = document.getElementById('updateStatus');
            el.textContent = text || '';
            el.style.color = color || 'var(--text-tertiary)';
        }

        function setUpdateProgress(visible, percent) {
            const bar = document.getElementById('updateProgress');
            const fill = document.getElementById('updateProgressBar');
            bar.style.display = visible ? 'block' : 'none';
            if (visible) fill.style.width = (percent || 0) + '%';
        }

        async function checkForUpdate() {
            const Tauri = window.__TAURI__;
            const btn = document.getElementById('checkUpdateBtn');
            btn.disabled = true;
            btn.textContent = '检查中...';
            showUpdateStatus('', '');
            try {
                const update = await Tauri.updater.checkForUpdate();
                if (update && update.available) {
                    pendingUpdate = update;
                    const ver = update.version || '新版本';
                    showUpdateStatus('发现新版本 v' + ver + (update.body ? '\n' + update.body : ''), 'var(--text-secondary)');
                    btn.textContent = '下载更新';
                    btn.onclick = downloadUpdate;
                } else {
                    showUpdateStatus('已是最新版本', 'var(--text-tertiary)');
                    btn.textContent = '检查更新';
                    btn.onclick = checkForUpdate;
                }
            } catch(err) {
                showUpdateStatus('检查失败: ' + (err.message || err), 'var(--status-error-default)');
                btn.textContent = '检查更新';
            } finally {
                btn.disabled = false;
            }
        }

        async function downloadUpdate() {
            if (!pendingUpdate) return;
            const btn = document.getElementById('checkUpdateBtn');
            btn.disabled = true;
            btn.textContent = '下载中...';
            setUpdateProgress(true, 0);
            showUpdateStatus('正在下载...', '');
            let lastEmit = 0;
            try {
                await pendingUpdate.downloadAndInstall(event => {
                    const now = Date.now();
                    if (event.event === 'Downloading' && now - lastEmit > 100) {
                        lastEmit = now;
                        if (event.data && event.data.contentLength) {
                            const pct = Math.round((event.data.downloaded / event.data.contentLength) * 100);
                            setUpdateProgress(true, pct);
                        }
                    } else if (event.event === 'Downloaded') {
                        setUpdateProgress(true, 100);
                    }
                });
                // 下载完成,显示重启按钮
                setUpdateProgress(false, 0);
                btn.style.display = 'none';
                document.getElementById('installUpdateBtn').style.display = 'block';
                showUpdateStatus('下载完成,点击重启以完成安装', 'var(--status-success-default)');
            } catch(err) {
                setUpdateProgress(false, 0);
                showUpdateStatus('下载失败: ' + (err.message || err), 'var(--status-error-default)');
                btn.disabled = false;
                btn.textContent = '重试下载';
            }
        }

        async function installUpdate() {
            const Tauri = window.__TAURI__;
            try {
                // Tauri 1.x: 下载并安装后需手动重启
                await Tauri.process.relaunch();
            } catch(err) {
                showUpdateStatus('安装失败: ' + (err.message || err), 'var(--status-error-default)');
            }
        }

        function applyConfigToUI(cfg) {
            document.getElementById('tcpPort').value = cfg.base_port;
            const outputDevice = document.getElementById('outputDevice');
            if (outputDevice.options.length > 0) {
                outputDevice.value = cfg.output_device || '';
            } else {
                outputDevice.setAttribute('data-pending', cfg.output_device || '');
            }
            document.getElementById('muteSpeaker').checked = cfg.mute_speaker;
            document.getElementById('autoStart').checked = cfg.auto_start;
        }

        function getConfigFromUI() {
            return {
                base_port: parseInt(document.getElementById('tcpPort').value) || 28900,
                output_device: document.getElementById('outputDevice').value,
                mute_speaker: document.getElementById('muteSpeaker').checked,
                auto_start: document.getElementById('autoStart').checked,
                sensitivity: 1.2,
            };
        }

        async function startService() {
            const cfg = getConfigFromUI();
            const Tauri = window.__TAURI__;
            try {
                await Tauri.invoke('start_service', { config: cfg });
                showError('');
            } catch(e) {
                showError(String(e));
            }
        }

        async function stopService() {
            const Tauri = window.__TAURI__;
            try {
                await Tauri.invoke('stop_service');
                showError('');
            } catch(e) {
                showError(String(e));
            }
        }

        // 静音外放复选框变化:持久化配置 + 服务运行中时通过 HTTP 同步切换 server
        async function onMuteSpeakerChange() {
            const Tauri = window.__TAURI__;
            const muted = document.getElementById('muteSpeaker').checked;
            try {
                await Tauri.invoke('set_mute_speaker', { muted: muted });
                config.mute_speaker = muted;
                const msg = muted ? '已静音外放' : '已开启外放';
                showError(msg, true);
                setTimeout(() => {
                    const el = document.getElementById('errorMsg');
                    if (el.textContent === msg) showError('');
                }, 1200);
            } catch(e) {
                showError(String(e));
                document.getElementById('muteSpeaker').checked = !muted;
            }
        }

        async function updateStatus() {
            const Tauri = window.__TAURI__;
            try {
                const status = await Tauri.invoke('get_status');
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');

                if (status.running) {
                    dot.className = 'status-dot running';
                    text.textContent = '运行中';
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    dot.className = 'status-dot stopped';
                    text.textContent = '已停止';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }

                setStatValue('statUptime', formatUptime(status.uptime_secs));
                setStatValue('statConns', status.connections);
                setStatValue('statTouches', status.touches_per_sec);
                setStatValue('statAudio', status.audio_frames_per_sec);

                const touchesCard = document.getElementById('statTouchesCard');
                if (status.touches_per_sec > 0) {
                    touchesCard.classList.add('glow');
                } else {
                    touchesCard.classList.remove('glow');
                }

                // 服务运行中时同步刷新配对状态(每次轮询都拉取,保持 PIN/列表最新)
                if (status.running) {
                    refreshPairing();
                } else {
                    renderPairingState(null);
                }
            } catch(e) {
                console.error(e);
            }
        }

        // ============ 配对管理 ============
        let lastPairingPin = null;

        async function refreshPairing() {
            const Tauri = window.__TAURI__;
            try {
                const state = await Tauri.invoke('get_pairing_state');
                renderPairingState(state);
            } catch(e) {
                renderPairingState(null, String(e));
            }
        }

        function renderPairingState(state, errMsg) {
            const pinEl = document.getElementById('pairingPin');
            const clientsEl = document.getElementById('pairingClients');

            if (!state) {
                pinEl.textContent = errMsg ? '服务未启动' : '------';
                pinEl.classList.add('empty');
                clientsEl.innerHTML = '<div class="pairing-empty">' + (errMsg || '服务未启动') + '</div>';
                lastPairingPin = null;
                return;
            }

            // PIN 显示
            if (state.pin) {
                pinEl.textContent = state.pin;
                pinEl.classList.remove('empty');
                // PIN 变化时闪烁
                if (lastPairingPin !== state.pin) {
                    pinEl.classList.remove('flash');
                    void pinEl.offsetWidth;
                    pinEl.classList.add('flash');
                    lastPairingPin = state.pin;
                }
            } else {
                pinEl.textContent = '已配对·无 PIN';
                pinEl.classList.add('empty');
                lastPairingPin = null;
            }

            // 已配对设备列表
            if (!state.paired_clients || state.paired_clients.length === 0) {
                clientsEl.innerHTML = '<div class="pairing-empty">暂无已配对设备</div>';
            } else {
                clientsEl.innerHTML = state.paired_clients.map(c => {
                    const date = new Date(c.paired_at * 1000);
                    const dateStr = date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                    const safeName = escapeHtml(c.client_name);
                    const safeKey = escapeHtml(c.pubkey_b64);
                    return '<div class="pairing-client-item">' +
                        '<div class="pairing-client-info">' +
                            '<span class="pairing-client-name" title="' + safeKey + '">' + safeName + '</span>' +
                            '<span class="pairing-client-meta">配对于 ' + dateStr + '</span>' +
                        '</div>' +
                        '<button class="ds-btn pairing-client-unpair" type="button" onclick="unpairClient(\'' + safeKey + '\', \'' + safeName + '\')">移除</button>' +
                    '</div>';
                }).join('');
            }
        }

        async function resetPairing() {
            const Tauri = window.__TAURI__;
            if (!confirm('确定要重置配对吗?所有已配对设备将被移除,需要重新配对才能连接。')) return;
            try {
                await Tauri.invoke('reset_pairing');
                await refreshPairing();
                showError('配对已重置,新 PIN 已生成', true);
                setTimeout(() => {
                    const el = document.getElementById('errorMsg');
                    if (el.textContent === '配对已重置,新 PIN 已生成') showError('');
                }, 1500);
            } catch(e) {
                showError(String(e));
            }
        }

        async function unpairClient(pubkeyB64, clientName) {
            const Tauri = window.__TAURI__;
            if (!confirm('确定要移除设备 "' + clientName + '" 吗?该设备需要重新配对才能连接。')) return;
            try {
                await Tauri.invoke('unpair_client', { pubkeyB64: pubkeyB64 });
                await refreshPairing();
            } catch(e) {
                showError(String(e));
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setStatValue(id, value) {
            const el = document.getElementById(id);
            const str = String(value);
            if (el.textContent !== str) {
                el.textContent = str;
                el.classList.remove('flash');
                void el.offsetWidth;
                el.classList.add('flash');
            }
        }

        function formatUptime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function showError(msg, isInfo) {
            const el = document.getElementById('errorMsg');
            if (msg) {
                el.textContent = msg;
                el.classList.add('show');
                if (isInfo) {
                    el.classList.add('info');
                } else {
                    el.classList.remove('info');
                }
            } else {
                el.classList.remove('show');
                el.classList.remove('info');
            }
        }

        init();
    </script>
</body>
</html>
