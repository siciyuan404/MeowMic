name: Build Desktop Console

on:
  push:
    branches: [main, master]
    paths:
      - 'pc/console/**'
      - 'pc/server/**'
      - 'crates/**'
      - '.github/workflows/build-console.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
    paths:
      - 'pc/console/**'
      - 'pc/server/**'
      - 'crates/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Console (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: meowmic-console-windows
            asset_suffix: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: meowmic-console-linux
            asset_suffix: linux-x64

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.5" --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-console-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-console-${{ runner.os }}-

      - name: Generate app icons
        shell: bash
        run: |
          mkdir -p pc/console/src-tauri/icons
          python - <<'PY'
          import struct, zlib

          def create_png(width, height, color):
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  return struct.pack(">I", len(data)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)

              raw = b""
              for _ in range(height):
                  raw += b"\x00" + color * width

              sig = b"\x89PNG\r\n\x1a\n"
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(raw)
              return sig + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")

          png = create_png(1024, 1024, b"\x66\x7e\xea\xff")
          with open("pc/console/src-tauri/icons/source.png", "wb") as f:
              f.write(png)
          print("source.png generated")
          PY

      - name: Generate Tauri icons
        working-directory: pc/console/src-tauri
        run: cargo tauri icon icons/source.png

      - name: Build server (release)
        run: cargo build --release -p meowmic-server

      - name: Place server binary for bundling
        shell: bash
        run: |
          mkdir -p pc/console/src-tauri/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/meowmic-server.exe pc/console/src-tauri/bin/
          else
            cp target/release/meowmic-server pc/console/src-tauri/bin/
          fi

      - name: Build Tauri console
        working-directory: pc/console/src-tauri
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          # NSIS installer
          cp pc/console/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          # MSI installer
          cp pc/console/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          # Raw exe
          cp pc/console/src-tauri/target/${{ matrix.target }}/release/meowmic-console.exe artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Prepare artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          # AppImage
          cp pc/console/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          # Deb
          cp pc/console/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          # Raw binary
          cp pc/console/src-tauri/target/${{ matrix.target }}/release/meowmic-console artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Rename artifacts with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF##*/}
          cd artifacts
          for f in *; do
            ext="${f##*.}"
            base="${f%.*}"
            mv "$f" "${base}-${TAG}-${{ matrix.asset_suffix }}.${ext}" 2>/dev/null || true
          done
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## Console Build Result (${{ runner.os }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls artifacts/* 1>/dev/null 2>&1; then
            echo "✅ 控制台构建成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh artifacts/ >> $GITHUB_STEP_SUMMARY 2>&1
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 控制台构建失败" >> $GITHUB_STEP_SUMMARY
          fi
