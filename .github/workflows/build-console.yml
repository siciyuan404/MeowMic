name: Build Desktop Console

on:
  push:
    branches: [main, master]
    paths:
      - 'pc/console/**'
      - 'pc/server/**'
      - 'crates/**'
      - '.github/workflows/build-console.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
    paths:
      - 'pc/console/**'
      - 'pc/server/**'
      - 'crates/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Console (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: meowmic-console-windows
            asset_suffix: windows-x64

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF##*/}          # v0.5.1
          VER=${TAG#v}                    # 0.5.1
          echo "Injecting version $VER"
          # tauri.conf.json
          python - <<PY
          import json, re
          p = "pc/console/src-tauri/tauri.conf.json"
          with open(p, "r", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["package"]["version"] = "$VER"
          with open(p, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          PY
          # workspace Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
          echo "Injected version: $VER"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libopus (vcpkg)
        shell: bash
        run: |
          vcpkg install opus:x64-windows-static-md
          # audiopus_sys 的 link_opus 会在路径后加 /lib,所以 OPUS_LIB_DIR 指向安装前缀
          echo "OPUS_LIB_DIR=${VCPKG_INSTALLATION_ROOT}/installed/x64-windows-static-md" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.5" --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-console-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-console-${{ runner.os }}-

      - name: Generate app icons
        shell: bash
        run: |
          mkdir -p pc/console/src-tauri/icons
          python - <<'PY'
          import struct, zlib

          def create_png(width, height, color):
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  return struct.pack(">I", len(data)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)

              raw = b""
              for _ in range(height):
                  raw += b"\x00" + color * width

              sig = b"\x89PNG\r\n\x1a\n"
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(raw)
              return sig + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")

          png = create_png(1024, 1024, b"\x66\x7e\xea\xff")
          with open("pc/console/src-tauri/icons/source.png", "wb") as f:
              f.write(png)
          print("source.png generated")
          PY

      - name: Generate Tauri icons
        working-directory: pc/console/src-tauri
        run: cargo tauri icon icons/source.png

      - name: Build server (release)
        run: cargo build --release -p meowmic-server

      - name: Place server binary for bundling
        shell: bash
        run: |
          mkdir -p pc/console/src-tauri/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/meowmic-server.exe pc/console/src-tauri/bin/
          else
            cp target/release/meowmic-server pc/console/src-tauri/bin/
          fi

      - name: Clean stale bundle artifacts
        shell: bash
        run: |
          # 清理缓存残留的旧版本 bundle 产物,避免新旧版本混在一起
          rm -rf target/${{ matrix.target }}/release/bundle/nsis/*
          rm -rf target/${{ matrix.target }}/release/bundle/msi/*

      - name: Build Tauri console
        working-directory: pc/console/src-tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Prepare artifacts (Windows)
        shell: bash
        run: |
          mkdir -p artifacts
          BUNDLE=target/${{ matrix.target }}/release/bundle
          # NSIS installer
          cp $BUNDLE/nsis/*.exe artifacts/ 2>/dev/null || true
          # MSI installer
          cp $BUNDLE/msi/*.msi artifacts/ 2>/dev/null || true
          # Raw exe
          cp target/${{ matrix.target }}/release/meowmic-console.exe artifacts/ 2>/dev/null || true
          # Updater artifacts: Tauri 1.x 对 .nsis.zip 签名,updater 下载的是 .zip 而非 .exe
          cp $BUNDLE/nsis/*.nsis.zip artifacts/ 2>/dev/null || true
          cp $BUNDLE/nsis/*.nsis.zip.sig artifacts/ 2>/dev/null || true
          cp $BUNDLE/msi/*.msi.zip artifacts/ 2>/dev/null || true
          cp $BUNDLE/msi/*.msi.zip.sig artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Rename artifacts with tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF##*/}
          cd artifacts
          for f in *; do
            [ "$f" = "latest.json" ] && continue
            # 正确处理多扩展名(.nsis.zip / .nsis.zip.sig / .msi.zip / .msi.zip.sig)
            if [[ "$f" == *.nsis.zip.sig ]]; then
              base="${f%.nsis.zip.sig}"; ext="nsis.zip.sig"
            elif [[ "$f" == *.nsis.zip ]]; then
              base="${f%.nsis.zip}"; ext="nsis.zip"
            elif [[ "$f" == *.msi.zip.sig ]]; then
              base="${f%.msi.zip.sig}"; ext="msi.zip.sig"
            elif [[ "$f" == *.msi.zip ]]; then
              base="${f%.msi.zip}"; ext="msi.zip"
            else
              base="${f%.*}"; ext="${f##*.}"
            fi
            # GitHub Release 上传时会把文件名中的空格 sanitize 为点,
            # 必须在本地重命名阶段就同步替换,否则 latest.json 里的 URL
            # (带空格)与 GitHub 上实际资产名(带点)不一致,导致 updater 404。
            base_dotted="${base// /.}"
            mv "$f" "${base_dotted}-${TAG}-${{ matrix.asset_suffix }}.${ext}" 2>/dev/null || true
          done
          ls -lh

      - name: Generate latest.json manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF##*/}
          VER=${TAG#v}
          # updater 下载的是 .nsis.zip,签名是 .nsis.zip.sig
          ZIP=$(ls artifacts/*-setup*.nsis.zip 2>/dev/null | head -1 || true)
          SIG=$(ls artifacts/*-setup*.nsis.zip.sig 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::未找到 updater .nsis.zip 产物"
            ls -lh artifacts/
            exit 1
          fi
          SIG_CONTENT=""
          if [ -n "$SIG" ] && [ -f "$SIG" ]; then
            SIG_CONTENT=$(cat "$SIG")
          else
            echo "::warning::未找到签名文件,updater 将无法验证更新"
          fi
          ZIP_NAME=$(basename "$ZIP")
          cat > artifacts/latest.json <<EOF
          {
            "version": "$VER",
            "notes": "MeowMic $TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG_CONTENT",
                "url": "https://github.com/siciyuan404/MeowMic/releases/download/$TAG/$ZIP_NAME"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## Console Build Result (${{ runner.os }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls artifacts/* 1>/dev/null 2>&1; then
            echo "✅ 控制台构建成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh artifacts/ >> $GITHUB_STEP_SUMMARY 2>&1
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 控制台构建失败" >> $GITHUB_STEP_SUMMARY
          fi
