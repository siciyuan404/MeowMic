[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/net",
    "crates/audio",
    "crates/touch",
    "pc/server",
    "pc/console/src-tauri",
    "tools/latency-probe",
    "tools/integration-test",
]
# Android JNI core 单独编译(cargo-ndk),不加入默认 workspace 以避免 host 平台编译冲突
exclude = [
    "android/rust-core",
]

[workspace.package]
version = "0.28.0"
edition = "2021"
license = "MIT"
authors = ["MeowMic"]

[workspace.dependencies]
# 共享依赖版本统一
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
zerocopy = { version = "0.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
# 配对密钥(Ed25519)
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
