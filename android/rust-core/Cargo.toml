[package]
name = "meowmic-android-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "meowmic"

[dependencies]
meowmic-net = { path = "../../crates/net" }
meowmic-audio = { path = "../../crates/audio", default-features = false, features = ["opus-codec"] }
meowmic-protocol = { path = "../../crates/protocol" }
meowmic-touch = { path = "../../crates/touch" }
jni = { version = "0.21", default-features = false }
tokio = { version = "1", features = ["full"] }
once_cell = "1"
log = "0.4"
android_logger = "0.13"
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
