/* ── Buttons ───────────────────────────────────────────────── */

      align-items: center;
      justify-content: center;
      gap: var(--spacer-6);
      height: 28px;
      padding: 0 var(--spacer-12);

    .ds-btn--secondary { background: var(--bg-overlay-l1); color: var(--text-default); border-color: var(--border-neutral-l1); }
    .ds-btn--secondary:hover { background: var(--bg-overlay-l2); border-color: var(--border-neutral-l2); }
    .ds-btn--secondary:active { background: var(--bg-overlay-l3); border-color: var(--border-neutral-l3); }
    .ds-btn--secondary[disabled] { color: var(--text-disabled); cursor: not-allowed; opacity: .7; }
    .ds-btn--tertiary,
    .ds-btn--ghost { background: transparent; color: var(--text-default); border-color: transparent; }

    .ds-btn--ghost:hover { background: var(--bg-overlay-l2); color: var(--text-default-hover); }
    .ds-btn--tertiary:active,
    .ds-btn--ghost:active { background: var(--bg-overlay-l3); }
    .ds-btn--tertiary[disabled],
    .ds-btn--ghost[disabled] { color: var(--text-disabled); cursor: not-allowed; }
    .ds-btn--brand { background: var(--bg-brand); color: var(--text-onbrand); border-color: var(--bg-brand); }
    .ds-btn--brand:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); }
    .ds-btn--brand:active { background: var(--bg-brand-active); border-color: var(--bg-brand-active); }
    .ds-btn--brand[disabled] { background: var(--bg-brand-disabled); border-color: transparent; color: var(--text-onbrand); cursor: not-allowed; }
    .ds-btn--icon { width: 28px; padding: 0; justify-content: center; }
    .ds-btn--icon.ds-btn--sm { width: 24px; }
    .ds-btn--icon.ds-btn--lg { width: 32px; }

/* ── Cards ─────────────────────────────────────────────────── */
    .ds-card {
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12);
      padding: var(--spacer-20);
      color: var(--text-default);
    }

/* ── Tag / Badge ───────────────────────────────────────────── */

    <style>
        /* 快捷启动网格容器 */

        /* 快捷启动格子 */

                        <div class="task-app" role="button" tabindex="0" aria-label="文件管理器">
                            <div class="task-app__icon"><i data-lucide="folder"></i></div>
                            <span class="task-app__name">文件</span>
                        </div>
                        <div class="task-app" role="button" tabindex="0" aria-label="Steam">
                            <div class="task-app__icon"><i data-lucide="gamepad-2"></i></div>
                            <span class="task-app__name">Steam</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script>
        lucide.createIcons();

        // 锁定开关
        (function () {
            var lockBtn = document.getElementById('lockBtn');
            var lockIcon = document.getElementById('lockIcon');
            var isLocked = false;

            lockBtn.addEventListener('click', function () {
                isLocked = !isLocked;
                document.body.classList.toggle('locked', isLocked);
                lockBtn.classList.toggle('is-locked', isLocked);
                lockBtn.setAttribute('aria-pressed', String(isLocked));
                lockBtn.setAttribute('aria-label', isLocked ? '解锁' : '锁定');
                lockIcon.setAttribute('data-lucide', isLocked ? 'lock' : 'lock-open');
                lucide.createIcons();
            });
        })();

        // 多窗口堆叠弹出列表
        (function () {
            var multiApps = document.querySelectorAll('.task-app.has-multi');
            multiApps.forEach(function (app) {
                app.addEventListener('click', function (e) {
                    if (e.target.closest('.task-pop__item-close')) return;
                    var isOpen = app.classList.contains('pop-open');
                    multiApps.forEach(function (other) {
                        if (other !== app) other.classList.remove('pop-open');
                    });
                    app.classList.toggle('pop-open', !isOpen);
                });
            });
            document.addEventListener('click', function (e) {
                if (!e.target.closest('.task-app.has-multi')) {
                    multiApps.forEach(function (app) {
                        app.classList.remove('pop-open');
                    });
                }
            });
            var popItems = document.querySelectorAll('.task-pop__item');
            popItems.forEach(function (item) {
                item.addEventListener('click', function (e) {
                    if (e.target.closest('.task-pop__item-close')) return;
                    e.stopPropagation();
                    var list = item.parentElement;
                    list.querySelectorAll('.task-pop__item').forEach(function (it) {
                        it.classList.remove('is-current');
                    });
                    item.classList.add('is-current');
                });
            });
        })();
    </script>
</body>
</html>
